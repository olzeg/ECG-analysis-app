name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test Contairners
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run Docker images
        run: docker compose build
      
      - name: Start services to initialize
        run: |
          echo "Oczekiwanie na uruchomienie bazy danych i brokera..."
          sleep 15
      
      - name: Run Backend Tests
        # if python test framework is installed in container, you can run tests using the following command
        run: docker compose exec backend pytest tests/
      
      - name: Run Module Tests (ECG Preprocessing)
        run: docker composeexec -T module-ecg-preprocessing python -m unittest discover -s tests/ecg/
      
      - name: Tear down services
        if: always()
        run: docker compose down -v